description: spoon skill evals across 4 agent harnesses

prompts: ['{{q}}']

# Run settings (run.sh only builds the workspace and adds the version).
evaluateOptions: { repeat: 2, maxConcurrency: 4, cache: false }
outputPath: [results/results.csv, results/results.json, results/results.html]

# All four run in the same temp workspace ($SPOON_WS, made by run.sh). It links this repo's
# spoon as .claude/skills/spoon (Claude) and .agents/skills/spoon (Codex, OpenCode).
providers:
  - id: file://provider.js # claude -p: promptfoo has no built-in for the CLI
    label: claude-cli
    config:
      model: claude-sonnet-5-5
      effort: medium
      working_dir: '{{ env.SPOON_WS }}'
      allowed_tools: [Read, Write, Agent, SendMessage, WebSearch, WebFetch]
  - id: anthropic:claude-agent-sdk
    label: claude-sdk
    config:
      model: claude-sonnet-5-5
      effort: medium
      apiKeyRequired: false # use the local Claude Code login
      working_dir: '{{ env.SPOON_WS }}'
      setting_sources: [project] # skip ~/.claude: no user skills, plugins or hooks
      skills: all
      append_allowed_tools: [Write, Agent, SendMessage, WebSearch, WebFetch]
  - id: openai:codex-sdk
    label: codex
    config:
      model_reasoning_effort: medium # model: Codex default for the local ChatGPT login
      working_dir: '{{ env.SPOON_WS }}'
      skip_git_repo_check: true
      sandbox_mode: workspace-write
      approval_policy: never
  - id: opencode:sdk
    label: opencode
    config:
      provider_id: opencode
      model: big-pickle # free OpenCode model: no Claude/OpenAI login for OpenCode here
      apiKeyRequired: false # free models need no key
      working_dir: '{{ env.SPOON_WS }}'
      tools: { skill: true, write: true } # on top of the read-only defaults

defaultTest:
  assert:
    - type: skill-used # built-in: works on any provider that reports skillCalls
      value: spoon
    - type: javascript
      value: file://asserts.js:spoonFromWorkspace
  options:
    provider: # judge for llm-rubric
      id: anthropic:claude-agent-sdk
      config: { model: claude-sonnet-5-5, effort: medium, apiKeyRequired: false }

tests:
  # 1. Triggering: the default asserts check spoon loaded, from the workspace.
  - description: trigger / clear (sp 1m)
    vars: { q: 'Who was the first president of the United States? sp 1m', max_turns: 1 }
  - description: trigger / near-miss (code request + sp 1m)
    vars: { q: 'create a python file for me that prints the time sp 1m', max_turns: 1 }
  - description: trigger / plain question, no spoon or sp = not loaded
    vars: { q: "What's a good way to learn to cook at home?", max_turns: 1 }
    options: { disableDefaultAsserts: true } # the defaults expect spoon to load
    assert:
      - { type: not-skill-used, value: spoon }
      - { type: javascript, value: file://asserts.js:spoonFromWorkspace }

  # 2. Dosing: long-answer questions, short doses.
  - description: dose / sp 1s = 1-2 sentences
    vars: { q: 'Who was the most beloved US president in history? sp 1s' }
    assert: [{ type: javascript, value: file://asserts.js:oneSentence }]
  - description: dose / sp 1p = one paragraph
    vars: { q: 'Can you summarize the causes of WW1? sp 1p' }
    assert: [{ type: not-regex, value: '\n\s*\n(?!\s*(🥄|$))' }] # no blank line, except before the footer
  - description: dose / sp 1m = 60-225 words, footer included
    vars: { q: 'Can you summarize the causes of WW1? sp 1m' }
    assert: [{ type: word-count, value: { min: 60, max: 225 } }]

  # 3. Formatting. (`art` is skipped: no harness here has an Artifact tool.)
  - description: format / sp bul = bullets with bold titles
    vars: { q: 'What are the main benefits of regular exercise? sp bul' }
    assert: [{ type: javascript, value: file://asserts.js:boldBullets }]
  - description: format / sp html = an HTML page
    vars: { q: 'Explain how a bill becomes a law in the US. sp html' }
    assert: [{ type: javascript, value: file://asserts.js:htmlPage }]
  - description: format / footer spells out tokens (sp 2s out)
    vars: { q: 'Why is the sky blue? sp 2s out' }
    assert: # last line is the footer and spells out both tokens
      - { type: regex, value: '\n🥄[^\n]*2 sentences[^\n]*\s*$' }
      - { type: regex, value: '\n🥄[^\n]*zoomed out[^\n]*\s*$' }
  - description: format / bare footer with no tokens (sp)
    vars: { q: "What's the capital of Australia? sp" }
    assert: [{ type: regex, value: '\n🥄\s*$' }] # last line is just 🥄

  # 4. Verification. Claude only: the skill's subagent steps use Claude Code tools.
  - description: verify / sp ver3 runs two subagents
    providers: ['claude-*']
    vars: { q: 'Is a tomato a fruit or a vegetable? sp ver3' }
    assert: [{ type: javascript, value: file://asserts.js:twoSubagents }]
  - description: verify / sp ver1 adds thoughtful instructions
    providers: ['claude-*']
    vars: { q: 'Is coffee bad for your health? sp ver1' }
    assert:
      - type: llm-rubric
        transform: file://asserts.js:transcript
        value: >-
          This is the trajectory of an AI run. The user added "sp ver1" (thoughtful verification).
          Pass only if both are true: (1) during the run, extra instructions on HOW to handle the
          question were loaded (beyond the user's message), and (2) those instructions push toward a
          more careful, thoughtful answer (e.g. care, data, sources, cover all angles).
          Judge the instructions, not the quality of the final answer.

  # 5. Subagent features finish and stay clean. Claude only. The reply must be a finished answer
  #    (not "agents are still running"), with no referee chatter in the body, and still fit the dose.
  - description: subagents / sp 2s ver3 = clean 2-sentence answer
    providers: ['claude-*']
    vars: { q: 'Is zero an even number? sp 2s ver3' }
    assert:
      - { type: javascript, value: file://asserts.js:cleanAnswer }
      - { type: javascript, value: file://asserts.js:twoSentences }
  - description: subagents / sp 1s cr = crystal protocol ran, clean 1-sentence answer
    providers: ['claude-*']
    vars: { q: 'What is a mutex? sp 1s cr' }
    assert:
      - { type: javascript, value: file://asserts.js:crystalRan }
      - { type: javascript, value: file://asserts.js:cleanAnswer }
      - { type: javascript, value: file://asserts.js:oneSentence }
  - description: subagents / sp 1p ver2 = sampling ran, clean answer
    providers: ['claude-*']
    vars: { q: 'Summarize the causes of the French Revolution. sp 1p ver2' }
    assert:
      - { type: javascript, value: file://asserts.js:samplingRan }
      - { type: javascript, value: file://asserts.js:cleanAnswer }
