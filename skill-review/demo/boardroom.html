<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boardroom — Skill Review Scorecard</title>
<style>
  :root {
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #94a3b8;
    --line: #e7e9ee;
    --line-soft: #f1f3f7;
    --paper: #fcfcfd;
    --card: #ffffff;
    --green: #10b981;     --green-text: #047857;  --green-soft: #ecfdf5;
    --lime: #84cc16;      --lime-text: #4d7c0f;   --lime-soft: #f7fee7;
    --amber: #f59e0b;     --amber-text: #b45309;  --amber-soft: #fffbeb;
    --orange: #f97316;    --orange-text: #c2410c; --orange-soft: #fff7ed;
    --red: #ef4444;       --red-text: #b91c1c;    --red-soft: #fef2f2;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum";
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 32px 64px; }

  /* ───── top bar ───── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; border-bottom: 1px solid var(--line); margin-bottom: 40px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .brand .sub { font-size: 12px; color: var(--ink-3); }
  .switcher { display: flex; align-items: center; gap: 8px; }
  .switcher label { font-size: 12px; color: var(--ink-3); }
  select#skill-select {
    appearance: none; -webkit-appearance: none;
    font: inherit; font-size: 13px; font-weight: 520; color: var(--ink);
    background: var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%2394a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>') no-repeat right 12px center;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 32px 7px 12px; cursor: pointer; min-width: 250px;
    box-shadow: var(--shadow);
    transition: border-color 120ms ease;
  }
  select#skill-select:hover { border-color: #cbd5e1; }
  select#skill-select:focus { outline: none; border-color: #94a3b8; }

  /* ───── hero ───── */
  .hero {
    display: grid; grid-template-columns: 1fr 200px; gap: 48px;
    align-items: center; margin-bottom: 16px;
  }
  .hero-meta .crumbs { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
  .hero-meta .crumbs b { color: var(--ink-2); font-weight: 550; }
  h1.skill-name {
    font-size: 32px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.15;
    margin-bottom: 10px;
  }
  .hero-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; border: 1px solid transparent;
  }
  .chip .dotc { width: 6px; height: 6px; border-radius: 50%; }
  .chip.verdict-safe   { color: var(--green-text);  background: var(--green-soft);  border-color: #a7f3d0; }
  .chip.verdict-review { color: var(--amber-text);  background: var(--amber-soft);  border-color: #fde68a; }
  .chip.verdict-unsafe { color: var(--red-text);    background: var(--red-soft);    border-color: #fecaca; }
  .chip.band { color: var(--ink-2); background: var(--line-soft); border-color: var(--line); text-transform: none; letter-spacing: 0; }
  .chip.qrank { color: var(--ink-2); background: #fff; border-color: var(--line); text-transform: none; letter-spacing: 0; }
  .chip.qrank .up { color: var(--green-text); }
  .chip.qrank .down { color: var(--red-text); }
  .hero-stats { font-size: 12px; color: var(--ink-3); }
  .hero-stats span + span::before { content: "·"; margin: 0 7px; color: #cbd5e1; }

  .narrative {
    font-size: 15px; line-height: 1.65; color: var(--ink-2);
    border-left: 2px solid var(--line); padding-left: 16px;
    margin: 8px 0 44px; max-width: 760px;
  }

  /* gauge */
  .gauge-box { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge { position: relative; width: 184px; height: 184px; }
  .gauge svg { transform: rotate(-90deg); display: block; }
  .gauge .track { fill: none; stroke: var(--line-soft); stroke-width: 11; }
  .gauge .arc {
    fill: none; stroke-width: 11; stroke-linecap: round;
    transition: stroke-dashoffset 900ms cubic-bezier(0.22, 1, 0.36, 1), stroke 300ms ease;
  }
  .gauge-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .gauge-score { font-size: 42px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; }
  .gauge-grade {
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    padding: 2px 10px; border-radius: 999px; margin-top: 4px;
  }
  .gauge-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); margin-top: 4px; }

  /* ───── pillar metric strip ───── */
  .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 48px; }
  .metric {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 16px 14px; box-shadow: var(--shadow);
  }
  .metric .m-name { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink-2); margin-bottom: 1px; }
  .metric .m-weight { font-size: 10.5px; color: var(--ink-3); margin-bottom: 12px; }
  .metric .m-score { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; line-height: 1; margin-bottom: 10px; }
  .metric .m-bar { height: 3px; background: var(--line-soft); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .metric .m-fill { height: 100%; border-radius: 2px; width: 0; transition: width 700ms cubic-bezier(0.22, 1, 0.36, 1), background-color 300ms ease; }
  .metric .m-delta { font-size: 11px; font-weight: 550; }
  .metric .m-delta.up { color: var(--green-text); }
  .metric .m-delta.down { color: var(--red-text); }
  .metric .m-delta.flat { color: var(--ink-3); }
  .metric .m-delta small { color: var(--ink-3); font-weight: 400; font-size: 10.5px; }

  /* ───── breakdown ───── */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-head h2 { font-size: 16px; font-weight: 650; letter-spacing: -0.015em; }
  .section-head .hint { font-size: 12px; color: var(--ink-3); }
  .breakdown { margin-bottom: 48px; }
  .pillar-group {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden;
  }
  .pillar-head {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; background: #fafbfc; border-bottom: 1px solid var(--line);
  }
  .pillar-head .p-name { font-size: 13px; font-weight: 640; letter-spacing: -0.01em; }
  .pillar-head .p-weight { font-size: 11px; color: var(--ink-3); }
  .pillar-head .p-spacer { flex: 1; }
  .pillar-head .p-counts { display: flex; gap: 6px; }
  .count-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 550; color: var(--ink-2);
    padding: 2px 8px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
  }
  .count-pill .cd { width: 6px; height: 6px; border-radius: 50%; }
  .pillar-head .p-score { font-size: 15px; font-weight: 650; min-width: 44px; text-align: right; }

  .check-row, details.check-exp > summary {
    display: grid;
    grid-template-columns: 62px minmax(150px, 190px) 76px 14px 1fr 16px;
    gap: 14px; align-items: center;
    padding: 9px 18px;
    border-top: 1px solid var(--line-soft);
    min-height: 40px;
  }
  .pillar-body > :first-child, .pillar-body > details:first-child > summary { border-top: none; }
  details.check-exp > summary { cursor: pointer; list-style: none; transition: background-color 120ms ease; }
  details.check-exp > summary::-webkit-details-marker { display: none; }
  details.check-exp > summary:hover { background: #fafbfc; }
  details.check-exp[open] > summary { background: #fafbfc; }

  .id-chip {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px; font-weight: 550; color: var(--ink-2);
    background: var(--line-soft); border: 1px solid var(--line);
    border-radius: 5px; padding: 2px 0; text-align: center;
  }
  .check-name { font-size: 13px; font-weight: 520; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg-bar { display: flex; gap: 3px; }
  .seg { width: 15px; height: 5px; border-radius: 2px; background: var(--line); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; justify-self: center; }
  .status-dot.pass { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .status-dot.warn { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
  .status-dot.fail { background: var(--red);   box-shadow: 0 0 0 3px var(--red-soft); }
  .check-note { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev {
    width: 9px; height: 9px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
    transform: rotate(45deg); transition: transform 160ms ease; justify-self: center; margin-top: -3px;
  }
  details[open] .chev { transform: rotate(-135deg); margin-top: 3px; }

  .check-body { padding: 4px 18px 16px 94px; }
  .check-body blockquote {
    font-size: 12.5px; line-height: 1.6; color: var(--ink-2);
    background: #fafbfc; border-left: 2px solid var(--line);
    padding: 10px 14px; border-radius: 0 6px 6px 0; margin-bottom: 10px;
  }
  .check-body blockquote .q-label, .fix-line .f-label {
    display: block; font-size: 10px; font-weight: 650; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px;
  }
  .fix-line { font-size: 12.5px; line-height: 1.6; color: var(--ink); padding-left: 14px; border-left: 2px solid var(--green); }

  /* ───── footer panels ───── */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; align-items: start; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px;
  }
  .panel h3 { font-size: 13px; font-weight: 650; letter-spacing: -0.01em; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .panel h3 .ico { width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .panel h3 .ico.good { background: var(--green-soft); color: var(--green-text); }
  .panel h3 .ico.fix  { background: var(--amber-soft); color: var(--amber-text); }
  .strength { display: flex; gap: 10px; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); padding: 9px 0; border-top: 1px solid var(--line-soft); }
  .strength:first-of-type { border-top: none; padding-top: 0; }
  .strength .tick { color: var(--green-text); font-weight: 650; flex-shrink: 0; }
  .fixcard { padding: 13px 0; border-top: 1px solid var(--line-soft); }
  .fixcard:first-of-type { border-top: none; padding-top: 0; }
  .fixcard .f-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .fixcard .f-title { font-size: 12.5px; font-weight: 600; line-height: 1.45; }
  .impact { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; margin-top: 1px; }
  .impact.high   { color: var(--red-text);   background: var(--red-soft); }
  .impact.medium { color: var(--amber-text); background: var(--amber-soft); }
  .impact.low    { color: var(--ink-2);      background: var(--line-soft); }
  .diff { font-size: 12px; line-height: 1.55; border: 1px solid var(--line-soft); border-radius: 7px; overflow: hidden; }
  .diff .before, .diff .after { padding: 7px 11px 7px 26px; position: relative; }
  .diff .before { background: var(--red-soft); color: var(--red-text); text-decoration: line-through; text-decoration-color: rgba(185, 28, 28, 0.4); }
  .diff .after  { background: var(--green-soft); color: var(--green-text); border-top: 1px solid #d1fae5; }
  .diff .before::before { content: "−"; position: absolute; left: 10px; text-decoration: none; font-weight: 650; }
  .diff .after::before  { content: "+"; position: absolute; left: 10px; font-weight: 650; }

  /* history slot + footer */
  .history {
    border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 40px;
  }
  .history .h-label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .history .h-note { font-size: 12px; color: var(--ink-3); }
  footer.colophon {
    border-top: 1px solid var(--line); padding-top: 18px;
    font-size: 11.5px; color: var(--ink-3); display: flex; justify-content: space-between;
  }
  footer.colophon a { color: var(--ink-2); text-decoration: none; }

  /* switch transition */
  #report { transition: opacity 140ms ease; }
  #report.swapping { opacity: 0; }

  /* responsive */
  @media (max-width: 860px) {
    .wrap { padding: 0 18px 48px; }
    .hero { grid-template-columns: 1fr; gap: 28px; }
    .gauge-box { order: -1; }
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .check-row, details.check-exp > summary { grid-template-columns: 56px 1fr 76px 14px 16px; }
    .check-note { display: none; }
    .check-body { padding-left: 18px; }
    .panels { grid-template-columns: 1fr; }
  }

  /* ───── print ───── */
  @media print {
    body { background: #fff; font-size: 12px; }
    .wrap { max-width: none; padding: 0; }
    .switcher, .chev { display: none; }
    .topbar { margin-bottom: 20px; }
    .metric, .pillar-group, .panel { box-shadow: none; break-inside: avoid; }
    .check-row, details.check-exp > summary { break-inside: avoid; }
    .check-note { white-space: normal; }
    .gauge .arc { transition: none; }
    .narrative { margin-bottom: 24px; }
    .metrics { margin-bottom: 24px; }
    .breakdown { margin-bottom: 24px; }
    a { color: inherit; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark">Boardroom</span>
      <span class="sub">Skill Review · Executive Scorecard</span>
    </div>
    <div class="switcher">
      <label for="skill-select">Skill</label>
      <select id="skill-select" aria-label="Select skill to review"></select>
    </div>
  </div>
  <main id="report" aria-live="polite"></main>
  <footer class="colophon">
    <span id="colophon-left"></span>
    <span>Boardroom · single-file report · no external dependencies</span>

</div>

const PILLARS = [
  { key: 'activation',  label: 'Activation & Metadata',  short: 'Activation',  weight: 20 },
  { key: 'instruction', label: 'Instruction Quality',     short: 'Instruction', weight: 25 },
  { key: 'structure',   label: 'Structure & Efficiency',  short: 'Structure',   weight: 20 },
  { key: 'security',    label: 'Security & Trust',        short: 'Security',    weight: 25 },
  { key: 'ops',         label: 'Maintainability & Ops',   short: 'Ops',         weight: 10 }
];

const BANDS = [
  { min: 90, fill: '#10b981', text: 'var(--green-text)',  soft: 'var(--green-soft)' },
  { min: 75, fill: '#84cc16', text: 'var(--lime-text)',   soft: 'var(--lime-soft)' },
  { min: 60, fill: '#f59e0b', text: 'var(--amber-text)',  soft: 'var(--amber-soft)' },
  { min: 40, fill: '#f97316', text: 'var(--orange-text)', soft: 'var(--orange-soft)' },
  { min: -1, fill: '#ef4444', text: 'var(--red-text)',    soft: 'var(--red-soft)' }
];
const band = s => BANDS.find(b => s >= b.min);
const RES = {
  pass: { fill: 'var(--green)', cls: 'pass' },
  warn: { fill: 'var(--amber)', cls: 'warn' },
  fail: { fill: 'var(--red)',   cls: 'fail' }
};

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);

const select = document.getElementById('skill-select');
const report = document.getElementById('report');

const byQuality = DATA.skills.slice().sort((a, b) => a.quality_rank - b.quality_rank);
byQuality.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.skill;
  opt.textContent = `#${s.quality_rank}  ${s.skill} — ${s.grade} ${s.overall}`;
  select.appendChild(opt);
});
select.value = byQuality[0].skill;
select.addEventListener('change', () => {
  report.classList.add('swapping');
  setTimeout(() => { render(select.value); report.classList.remove('swapping'); }, 140);
});

document.getElementById('colophon-left').textContent =
  `Generated ${DATA.generated} · source: ${DATA.source} · corpus avg ${DATA.aggregates.avg_overall} · public corpus avg ${DATA.aggregates.public_corpus_avg}`;

function gaugeHTML(skill) {
  const b = band(skill.overall);
  const R = 84, C = 2 * Math.PI * R;
  return `
    <div class="gauge-box">
      <div class="gauge" role="img" aria-label="Overall score ${skill.overall} out of 100, grade ${skill.grade}">
        <svg width="184" height="184" viewBox="0 0 184 184">
          <circle class="track" cx="92" cy="92" r="${R}"></circle>
          <circle class="arc" id="gauge-arc" cx="92" cy="92" r="${R}"
            stroke="${b.fill}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}"
            data-target="${(C * (1 - skill.overall / 100)).toFixed(2)}"></circle>
        </svg>
        <div class="gauge-center">
          <div class="gauge-score">${skill.overall}</div>
          <div class="gauge-grade" style="color:${b.text};background:${b.soft}">${esc(skill.grade)} · ${esc(skill.band)}</div>
          <div class="gauge-label">Overall</div>
        </div>
      </div>
    </div>`;
}

function heroHTML(skill) {
  const delta = skill.rank_delta;
  const deltaTxt = delta > 0 ? `<span class="up">▲ ${delta}</span>` : delta < 0 ? `<span class="down">▼ ${Math.abs(delta)}</span>` : '<span>—</span>';
  const st = skill.stats || {};
  return `
    <section class="hero">
      <div class="hero-meta">
        <div class="crumbs">skills.sh · <b>#${skill.rank}</b> by installs · <b>${esc(skill.installs)}</b> installs</div>
        <h1 class="skill-name">${esc(skill.skill)} <span style="font-weight:400;color:var(--ink-3);font-size:20px">/ ${esc(skill.author)}</span></h1>
        <div class="hero-chips">
          <span class="chip verdict-${skill.verdict.toLowerCase()}"><span class="dotc" style="background:currentColor"></span>${esc(skill.verdict)}</span>
          <span class="chip qrank">Quality #${skill.quality_rank} of ${DATA.aggregates.count} &nbsp;${deltaTxt}&nbsp; vs install rank</span>
        </div>
        <div class="hero-stats">
          <span>${st.body_lines} body lines</span><span>${st.body_words} words</span><span>~${st.est_skillmd_tokens} tokens</span><span>${st.supporting_files} supporting file${st.supporting_files === 1 ? '' : 's'}</span><span>description ${st.desc_chars} chars</span>
        </div>
      </div>
      ${gaugeHTML(skill)}
    </section>
    <p class="narrative">${esc(skill.narrative)}</p>`;
}

function metricsHTML(skill) {
  return `<section class="metrics" aria-label="Pillar scores">` + PILLARS.map(p => {
    const score = skill.pillars[p.key].score;
    const avg = DATA.aggregates.avg_pillars[p.key];
    const d = score - avg;
    const b = band(score);
    let deltaCls = 'flat', arrow = '—', dTxt = 'on par';
    if (d >= 0.05)  { deltaCls = 'up';   arrow = '▲'; dTxt = `+${fmt(Math.abs(d))}`; }
    if (d <= -0.05) { deltaCls = 'down'; arrow = '▼'; dTxt = `−${fmt(Math.abs(d))}`; }
    return `
      <div class="metric">
        <div class="m-name">${esc(p.short)}</div>
        <div class="m-weight">${p.weight}% of overall</div>
        <div class="m-score" style="color:${b.text}">${fmt(score)}</div>
        <div class="m-bar"><div class="m-fill" data-w="${score}" style="background:${b.fill}"></div></div>
        <div class="m-delta ${deltaCls}">${arrow} ${dTxt} <small>vs corpus avg ${fmt(avg)}</small></div>
      </div>`;
  }).join('') + `</section>`;
}

function segBar(score, result) {
  const fill = RES[result] ? RES[result].fill : 'var(--ink-3)';
  let segs = '';
  for (let i = 0; i < 4; i++) {
    segs += `<span class="seg" style="${i < score ? `background:${fill}` : ''}"></span>`;
  }
  return `<span class="seg-bar" role="img" aria-label="score ${score} of 4">${segs}</span>`;
}

function checkRowInner(c) {
  return `
    <span class="id-chip">${esc(c.id)}</span>
    <span class="check-name">${esc(c.name)}</span>
    ${segBar(c.score, c.result)}
    <span class="status-dot ${RES[c.result] ? RES[c.result].cls : ''}" title="${esc(c.result)}"></span>
    <span class="check-note">${esc(c.evidence)}</span>`;
}

function breakdownHTML(skill) {
  const groups = PILLARS.map(p => {
    const pillar = skill.pillars[p.key];
    const b = band(pillar.score);
    const counts = { pass: 0, warn: 0, fail: 0 };
    pillar.checks.forEach(c => { if (counts[c.result] != null) counts[c.result]++; });
    const countPills = ['pass', 'warn', 'fail']
      .filter(k => counts[k] > 0)
      .map(k => `<span class="count-pill"><span class="cd" style="background:${RES[k].fill}"></span>${counts[k]} ${k}</span>`)
      .join('');
    const rows = pillar.checks.map(c => {
      if (c.result === 'pass') {
        return `<div class="check-row">${checkRowInner(c)}<span></span></div>`;
      }
      return `
        <details class="check-exp">
          <summary>${checkRowInner(c)}<span class="chev" aria-hidden="true"></span></summary>
          <div class="check-body">
            <blockquote><span class="q-label">Evidence</span>${esc(c.evidence)}</blockquote>
            ${c.fix ? `<div class="fix-line"><span class="f-label">Fix</span>${esc(c.fix)}</div>` : ''}
          </div>
        </details>`;
    }).join('');
    return `
      <div class="pillar-group">
        <div class="pillar-head">
          <span class="p-name">${esc(p.label)}</span>
          <span class="p-weight">${p.weight}%</span>
          <span class="p-spacer"></span>
          <span class="p-counts">${countPills}</span>
          <span class="p-score" style="color:${b.text}">${fmt(pillar.score)}</span>
        </div>
        <div class="pillar-body">${rows}</div>
      </div>`;
  }).join('');
  return `
    <section class="breakdown">
      <div class="section-head">
        <h2>Rubric breakdown</h2>
        <span class="hint">43 checks across 5 pillars · warning and failing rows expand to evidence &amp; fix</span>
      </div>
      ${groups}
    </section>`;
}

function panelsHTML(skill) {
  const strengths = (skill.headline_strengths || []).map(s =>
    `<div class="strength"><span class="tick">✓</span><span>${esc(s)}</span></div>`).join('');
  const fixes = (skill.headline_fixes || []).map(f => `
    <div class="fixcard">
      <div class="f-head">
        <span class="f-title">${esc(f.title)}</span>
        <span class="impact ${esc(f.impact)}">${esc(f.impact)}</span>
      </div>
      <div class="diff">
        <div class="before">${esc(f.before)}</div>
        <div class="after">${esc(f.after)}</div>
      </div>
    </div>`).join('');
  return `
    <section class="panels">
      <div class="panel">
        <h3><span class="ico good">✓</span>Working well</h3>
        ${strengths || '<div class="strength"><span>No headline strengths recorded.</span></div>'}
      </div>
      <div class="panel">
        <h3><span class="ico fix">!</span>Fix first</h3>
        ${fixes || '<div class="fixcard"><span class="f-title">Nothing urgent — keep shipping.</span></div>'}
      </div>
    </section>
    <div class="history">
      <span class="h-label">Score history</span>
      <span class="h-note">First review (${DATA.generated}) — trend appears after the next run.</span>
    </div>`;
}

function render(name) {
  const skill = DATA.skills.find(s => s.skill === name);
  report.innerHTML = heroHTML(skill) + metricsHTML(skill) + breakdownHTML(skill) + panelsHTML(skill);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const arc = document.getElementById('gauge-arc');
    if (arc) arc.style.strokeDashoffset = arc.dataset.target;
    report.querySelectorAll('.m-fill').forEach(el => { el.style.width = el.dataset.w + '%'; });
  }));
}

render(select.value);

// print: expand all detail rows, restore afterwards
let openedForPrint = [];
window.addEventListener('beforeprint', () => {
  openedForPrint = [];
  document.querySelectorAll('details.check-exp:not([open])').forEach(d => { d.open = true; openedForPrint.push(d); });
});
window.addEventListener('afterprint', () => {
  openedForPrint.forEach(d => { d.open = false; });
  openedForPrint = [];
});
</script>
</body>
</html>
